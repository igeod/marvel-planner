<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Marvel Planner</title>
    <meta
      name="description"
      content="Marvel Cinematic Universe watch planner: every film and series by saga and phase, with what to watch first."
    />
    <script>
      // Splash on the first load of a session; later loads only run the intro. The fallback frees the
      // page if the bundle never starts.
      (function () {
        var d = document.documentElement;
        var seen = false;
        try {
          seen = sessionStorage.getItem("splash-seen") === "1";
        } catch (e) {}
        if (seen) {
          d.dataset.intro = "";
          setTimeout(function () {
            delete d.dataset.intro;
          }, 450);
          return;
        }
        d.dataset.splash = "on";
        d.dataset.splashStart = String(performance.now());
        d.dataset.splashFallback = String(
          setTimeout(function () {
            var r = document.getElementById("root");
            if (r) r.inert = false;
            delete d.dataset.splash;
          }, 6000),
        );
      })();
    </script>
    <style>
      html {
        scrollbar-gutter: stable;
      }
      #splash {
        display: none;
      }
      html[data-splash="on"] {
        overflow: hidden;
      }
      html[data-splash="on"] #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--accent, #c8202b);
        color: var(--white, #fff);
        font-family: var(--font-display, "Anton", "Impact", "Arial Narrow", sans-serif);
        font-size: clamp(3.5rem, 11vw, 9rem);
        line-height: 1.02;
        letter-spacing: 0.02em;
        text-align: center;
        text-transform: uppercase;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">MARVEL PLANNER</div>
    <div id="root"></div>
    <script>
      if (document.documentElement.dataset.splash === "on")
        document.getElementById("root").inert = true;
    </script>
    <noscript>Marvel Planner needs JavaScript to run. Please enable it in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
