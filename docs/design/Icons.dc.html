<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>p,li{text-wrap:pretty}</style>
</helmet>
<div style="width:100%;max-width:1440px;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-body);line-height:1.5;padding:clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:var(--sp-8);box-sizing:border-box">
  <div>
    <h1 style="margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(40px,8vw,64px);line-height:1;text-transform:uppercase">Icone</h1>
    <p style="margin:var(--sp-3) 0 0;max-width:72ch;color:var(--ink-2)">Il set è Lucide (lucide.dev), a tratto, colore ereditato dal testo. Niente emoji.</p>
  </div>
  <section style="background:var(--surface);border-radius:var(--r-xl);padding:var(--sp-8);display:flex;flex-direction:column;gap:var(--sp-4)">
    <h2 style="margin:0;font-size:var(--fs-h3);font-weight:800">Lucide: set base a 16, 20 e 24px</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:var(--sp-2)"><div style="background:var(--bg);border-radius:var(--r-row);padding:var(--sp-4);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3)"><div style="display:flex;align-items:center;gap:var(--sp-4)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></div><span style="font-size:var(--fs-caption);font-weight:500;color:var(--ink-2)">check</span></div><div style="background:var(--bg);border-radius:var(--r-row);padding:var(--sp-4);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3)"><div style="display:flex;align-items:center;gap:var(--sp-4)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div><span style="font-size:var(--fs-caption);font-weight:500;color:var(--ink-2)">chevron-down</span></div><div style="background:var(--bg);border-radius:var(--r-row);padding:var(--sp-4);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3)"><div style="display:flex;align-items:center;gap:var(--sp-4)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></div><span style="font-size:var(--fs-caption);font-weight:500;color:var(--ink-2)">plus</span></div><div style="background:var(--bg);border-radius:var(--r-row);padding:var(--sp-4);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3)"><div style="display:flex;align-items:center;gap:var(--sp-4)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></div><span style="font-size:var(--fs-caption);font-weight:500;color:var(--ink-2)">x</span></div><div style="background:var(--bg);border-radius:var(--r-row);padding:var(--sp-4);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3)"><div style="display:flex;align-items:center;gap:var(--sp-4)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"></path></svg><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"></path></svg></div><span style="font-size:var(--fs-caption);font-weight:500;color:var(--ink-2)">arrow-right</span></div><div style="background:var(--bg);border-radius:var(--r-row);padding:var(--sp-4);display:flex;flex-direction:column;align-items:center;gap:var(--sp-3)"><div style="display:flex;align-items:center;gap:var(--sp-4)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.3-4.3M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0z"></path></svg><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.3-4.3M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0z"></path></svg><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.3-4.3M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0z"></path></svg></div><span style="font-size:var(--fs-caption);font-weight:500;color:var(--ink-2)">search</span></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:var(--sp-4);align-items:center"><button style="min-height:var(--tap);padding:var(--sp-3) var(--sp-6);border:0;border-radius:var(--r-pill);background:var(--accent);color:var(--white);font:700 15px 'Hanken Grotesk',sans-serif;display:inline-flex;gap:var(--sp-2);align-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Segna come visto</button><button aria-label="Chiudi" style="width:44px;height:var(--tap);border:0;border-radius:var(--r-pill);background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
  </section>
  <sc-for list="{{ sections }}" as="s" hint-placeholder-count="2">
    <section style="background:var(--surface);border-radius:var(--r-xl);padding:var(--sp-8);display:flex;flex-direction:column;gap:var(--sp-2)">
      <h2 style="margin:0 0 var(--sp-2);font-size:var(--fs-h3);font-weight:800">{{ s.title }}</h2>
      <sc-for list="{{ s.rows }}" as="r" hint-placeholder-count="5">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:var(--sp-2) var(--sp-4);background:var(--bg);border-radius:var(--r-input);padding:var(--sp-3) var(--sp-5);font-size:var(--fs-label);align-items:center">
          <b>{{ r.a }}</b><code style="font-weight:700;color:var(--accent)">{{ r.b }}</code><span style="color:var(--ink-2)">{{ r.c }}</span>
        </div>
      </sc-for>
    </section>
  </sc-for>
  <section style="background:var(--surface);border-radius:var(--r-xl);padding:var(--sp-8);display:flex;flex-direction:column;gap:var(--sp-3)">
    <h2 style="margin:0;font-size:var(--fs-h3);font-weight:800">Regole</h2>
    <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);max-width:90ch">
      <sc-for list="{{ rules }}" as="x" hint-placeholder-count="5"><li>{{ x }}</li></sc-for>
    </ul>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {"sections":[{"title":"Dimensioni","rows":[{"a":"Small","b":"16px, stroke 2","c":"inline con label 14px"},{"a":"Medium","b":"20px, stroke 2","c":"bottoni, righe (default)"},{"a":"Large","b":"24px, stroke 2","c":"header, azioni principali, stati vuoti"}]},{"title":"Uso","rows":[{"a":"Allineamento","b":"centro verticale con la x-height","c":"gap icona–testo 8px"},{"a":"Colore","b":"currentColor","c":"segue ink, slate o bianco su rosso"},{"a":"Solo icona","b":"area 44×44, aria-label","c":"tooltip con il nome"},{"a":"Stati","b":"visto, da vedere, prossimo, bloccato","c":"icona sempre insieme a etichetta o forma, mai solo colore"}]}],"rules":["Solo Lucide: viewBox 24, stroke 2, linecap e linejoin round, fill none. Non mescolare altre librerie.","Mai icone decorative senza funzione. Nomi Lucide in kebab-case (check, chevron-down, circle-check).","Riempita solo per stato attivo (es. stella), a tratto per riposo.","SVG inline o sprite, mai immagini raster."]}; }
}
</script>
</body>
</html>
